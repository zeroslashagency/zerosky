name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: install · lint · typecheck · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zerosky
          POSTGRES_PASSWORD: zerosky
          POSTGRES_DB: zerosky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://zerosky:zerosky@localhost:5432/zerosky
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-for-ci-please-replace-in-prod-32chars
      SEED_PASSWORD: test-seed-password-for-ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        run: |
          cd packages/database
          npm run db:deploy
        env:
          DATABASE_URL: postgresql://zerosky:zerosky@localhost:5432/zerosky
          REDIS_URL: redis://localhost:6379

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test -- --coverage
        env:
          DATABASE_URL: postgresql://zerosky:zerosky@localhost:5432/zerosky
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-please-replace-in-prod-32chars
          SEED_PASSWORD: test-seed-password-for-ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/
            packages/*/coverage/
            apps/*/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://zerosky:zerosky@localhost:5432/zerosky
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-please-replace-in-prod-32chars
          SEED_PASSWORD: test-seed-password-for-ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            apps/pos-web/.next/
            apps/kds-display/.next/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zerosky
          POSTGRES_PASSWORD: zerosky
          POSTGRES_DB: zerosky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://zerosky:zerosky@localhost:5432/zerosky
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-for-ci-please-replace-in-prod-32chars
      SEED_PASSWORD: test-seed-password-for-ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Setup database
        run: |
          cd packages/database
          npm run db:deploy
          npm run db:seed
        env:
          DATABASE_URL: postgresql://zerosky:zerosky@localhost:5432/zerosky
          REDIS_URL: redis://localhost:6379
          SEED_PASSWORD: test-seed-password-for-ci

      - name: Run Playwright tests
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://zerosky:zerosky@localhost:5432/zerosky
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-please-replace-in-prod-32chars
          SEED_PASSWORD: test-seed-password-for-ci

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
