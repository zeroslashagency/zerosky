# Zerosky — Local Development
# Postgres + Redis for local dev. Use docker-compose.prod.yml for production.

name: zerosky-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: zerosky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zerosky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerosky}
      POSTGRES_DB: ${POSTGRES_DB:-zerosky}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zerosky_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zerosky}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zerosky

  redis:
    image: redis:7-alpine
    container_name: zerosky-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - zerosky_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zerosky

volumes:
  zerosky_pgdata:
    driver: local
  zerosky_redisdata:
    driver: local

networks:
  zerosky:
    driver: bridge
