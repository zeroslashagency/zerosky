name: mobile
description: Zerosky mobile app for waiters and captains
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: 2.5.1
  
  # HTTP client
  http: 1.2.1
  
  # Secure storage for tokens
  flutter_secure_storage: 9.2.2
  
  # Decimal arithmetic (money)
  decimal: 3.0.1
  
  # Internationalization
  intl: 0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
